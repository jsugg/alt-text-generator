name: Security Audit

# Production dependencies only (--omit=dev). The full-tree comparison against
# config/security/residual-advisories.json runs in dependency-residual-audit.yml.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * 1'

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-node-project

      - name: Run production dependency audit
        id: audit
        run: bash scripts/github/run-security-audit.sh

      # Advisory only: registry signature/provenance verification observes and
      # warns. Promote to a blocking step only after a low-noise track record.
      - name: Verify registry signatures (advisory)
        run: npm audit signatures || echo "::warning::npm audit signatures reported unverifiable packages"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-artifacts
          path: reports/security/
          if-no-files-found: ignore
          retention-days: 7

      - name: Write summary
        if: always()
        env:
          AUDIT_AVAILABLE: ${{ steps.audit.outputs.available || 'false' }}
          AUDIT_CRITICAL: ${{ steps.audit.outputs.critical || '0' }}
          AUDIT_HIGH: ${{ steps.audit.outputs.high || '0' }}
          AUDIT_LOW: ${{ steps.audit.outputs.low || '0' }}
          AUDIT_MODERATE: ${{ steps.audit.outputs.moderate || '0' }}
          AUDIT_STATUS: ${{ steps.audit.outputs.status || 'unknown' }}
        run: bash scripts/github/write-security-audit-summary.sh "$GITHUB_STEP_SUMMARY"

      - name: Fail when the registry audit is unavailable
        if: steps.audit.outputs.available != 'true'
        run: |
          echo "npm audit did not return a complete report after bounded retries."
          exit 1

      - name: Fail on high or critical findings
        if: >-
          steps.audit.outputs.available == 'true' &&
          (steps.audit.outputs.high != '0' || steps.audit.outputs.critical != '0')
        run: |
          echo "npm audit reported high or critical production dependency findings."
          exit 1
