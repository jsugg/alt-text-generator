# Dependency-update policy (see tests/unit/dependabotPolicy.test.js).
#
# Posture: TARGETED GROUPS, MERGE MANUALLY. Routine minor/patch updates are
# separated by production/development reachability. Majors remain isolated so
# one breaking upgrade cannot hide among unrelated changes; known peer-coupled
# majors (pino / pino-http) stay together. Security fixes remain grouped for
# prompt review. There is no auto-merge: humans review diff, changelog,
# provenance, and CI before merge.
#
# No update ignores: supported security fixes must remain visible. Routine
# minor/patch updates are grouped; majors that are not explicitly peer-coupled
# remain isolated PRs for deliberate migration and review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pino-major:
        applies-to: version-updates
        patterns:
          - pino
          - pino-http
        update-types:
          - major
      npm-production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
